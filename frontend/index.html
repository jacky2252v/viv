<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>frontend</title>

  <!-- Load GPT ONCE -->
  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>

  <script>
    window.googletag = window.googletag || { cmd: [] };

    let leftSideRail = null;
    let rightSideRail = null;

    googletag.cmd.push(() => {
      const pubads = googletag.pubads();

      // =========================
      // Define ALL ad slots here
      // =========================

      // Banner Ad
      googletag
        .defineSlot("/6355419/Travel/Europe/France/Paris", [300, 250], "banner-ad")
        .addService(pubads);

      // Static Ad
      googletag
        .defineSlot("/6355419/Travel/Europe", [100, 100], "static-ad-1")
        .addService(pubads);

      // Side Rails (may return null)
      leftSideRail = googletag.defineOutOfPageSlot(
        "/6355419/Travel/Europe",
        googletag.enums.OutOfPageFormat.LEFT_SIDE_RAIL
      );

      rightSideRail = googletag.defineOutOfPageSlot(
        "/6355419/Travel/Europe",
        googletag.enums.OutOfPageFormat.RIGHT_SIDE_RAIL
      );

      if (leftSideRail) leftSideRail.addService(pubads);
      if (rightSideRail) rightSideRail.addService(pubads);

      const responsiveAdSlot = googletag
        .defineSlot(
          "/6355419/Travel/Europe",
          [
            [300, 250],
            [728, 90],
            [750, 200],
          ],
          "responsive-ad",
        )
        .addService(googletag.pubads());

      const mapping = googletag
        .sizeMapping()
        .addSize(
          [1024, 768],
          [
            [750, 200],
            [728, 90],
          ],
        )
        .addSize([640, 480], [300, 250])
        .addSize([0, 0], [])
        .build();

      responsiveAdSlot.defineSizeMapping(mapping);

      // =========================
      // Global settings
      // =========================

      googletag.setConfig({
        singleRequest: true,
      });

      // Optional (good for dev/testing)
      // pubads.setRequestNonPersonalizedAds(1);

      googletag.enableServices();
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
